Name: QuickDash
Summary: 12 floating utility tools, QR payments, notes & translator running over any Android app
Description: |-
  QuickDash is a system-wide floating utility overlay for Android devices.
  Features 12 integrated floating tools:
  - Quick Collect: Instant UPI & PayPal payment QR code generator
  - Quick Scan: QR and barcode scanner
  - Quick Chat: Send direct WhatsApp messages without saving numbers
  - Smart Translator: Fast on-screen translation
  - Smart Clipboard: Rich clipboard history manager
  - Quick Notes: Floating notepad
  - Calculator: Floating math calculator with history
  - Quick Capture: On-screen screenshot and video recording

