version: 2

updates:
  # Gradle dependencies (Android app)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "dev"
    labels:
      - "dependencies"
      - "android"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      androidx-compose:
        patterns:
          - "androidx.*"
          - "com.google.android.material*"
      build-tools:
        patterns:
          - "com.android.*"
          - "org.jetbrains.kotlin.*"
          - "com.google.devtools.ksp*"
      firebase-google:
        patterns:
          - "com.google.firebase*"
          - "com.google.android.gms*"

  # npm dependencies (Website)
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "dev"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      npm-website:
        patterns:
          - "*"

  # npm dependencies (Cloudflare Workers)
  - package-ecosystem: "npm"
    directory: "/workers"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "dev"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      npm-workers:
        patterns:
          - "*"

  # GitHub Actions versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "dev"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
