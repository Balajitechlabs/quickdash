name: Build Signed Release (Artifact Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Sign Release Bundle & APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > quickdash.jks
            echo "Keystore decoded successfully"
          else
            echo "Error: KEYSTORE_BASE64 secret not found!"
            exit 1
          fi

      - name: Build Signed Play Store Bundle (AAB)
        env:
          KEYSTORE_PATH: quickdash.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_BROADCAST_BOT_TOKEN: ${{ secrets.TG_BROADCAST_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Build Signed Standalone APKs
        env:
          KEYSTORE_PATH: quickdash.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_BROADCAST_BOT_TOKEN: ${{ secrets.TG_BROADCAST_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          ./gradlew assembleRelease --no-daemon

      - name: Package Dist Binaries
        run: |
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab dist/app-release.aab
          cp app/build/outputs/apk/release/app-universal-release.apk dist/app-universal-release.apk
          cp app/build/outputs/apk/release/app-universal-release.apk dist/app-foss-release.apk
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk dist/app-arm64-v8a-release.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk dist/app-armeabi-v7a-release.apk
          cd dist && sha256sum *.apk *.aab > checksums.txt
          cat checksums.txt

      - name: Upload Signed Binaries Artifact
        uses: actions/upload-artifact@v7
        with:
          name: quickdash-v5.2.4-signed-binaries
          path: dist/
          retention-days: 7
