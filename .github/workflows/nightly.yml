name: Nightly

on:
  push:
    branches: [main, master, dev]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
  pull_request:
    branches: [main, master, dev]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Create local.properties
        run: |
          echo "TG_BOT_TOKEN=${{ secrets.TG_BOT_TOKEN }}" >> local.properties
          echo "TG_BROADCAST_BOT_TOKEN=${{ secrets.TG_BROADCAST_BOT_TOKEN }}" >> local.properties
          echo "TG_CHAT_ID=${{ secrets.TG_CHAT_ID }}" >> local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Debug build (Standard & FOSS)
        run: |
          ./gradlew assembleDebug
          ./gradlew assembleDebug -Pfoss

      - name: Unit tests (Standard & FOSS)
        run: |
          ./gradlew testDebugUnitTest
          ./gradlew testDebugUnitTest -Pfoss

      - name: Lint check
        run: ./gradlew lint