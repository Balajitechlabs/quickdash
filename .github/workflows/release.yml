name: Android Release

on:
  push:
    branches: [main, master]
    paths-ignore:
      - README.md
      - website/public/api/v1/update.json
      - website/public/api/v1/stats.json
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          else
            echo "Skipping — no keystore provided"
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Decode google-services.json
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          else
            echo "Skipping — no google-services.json provided"
          fi
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      - name: Create local.properties
        run: |
          echo "TG_BOT_TOKEN=${{ secrets.TG_BOT_TOKEN }}" >> local.properties
          echo "TG_BROADCAST_BOT_TOKEN=${{ secrets.TG_BROADCAST_BOT_TOKEN }}" >> local.properties
          echo "TG_CHAT_ID=${{ secrets.TG_CHAT_ID }}" >> local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Build signed APKs, AAB, and FOSS APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          SIGNING_FLAGS=""
          if [ -f keystore.jks ]; then
            KEYSTORE_PATH=$(pwd)/keystore.jks
            SIGNING_FLAGS="-Pandroid.injected.signing.store.file=$KEYSTORE_PATH \
                          -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
                          -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
                          -Pandroid.injected.signing.key.password=$KEY_PASSWORD"
          fi

          # 1. Build Standard Release APKs (Universal, arm64-v8a, armeabi-v7a)
          eval ./gradlew clean assembleRelease --parallel --build-cache "$SIGNING_FLAGS"

          # 2. Build Google Play App Bundle (.aab)
          eval ./gradlew bundleRelease --parallel --build-cache "$SIGNING_FLAGS"

          # 3. Stage standard artifacts
          mkdir -p release_artifacts
          cp app/build/outputs/apk/release/*.apk release_artifacts/ 2>/dev/null || true
          cp app/build/outputs/bundle/release/app-release.aab release_artifacts/ 2>/dev/null || true

          # 4. Build 100% Zero-Tracker FOSS Release APK (for F-Droid & IzzyOnDroid)
          eval ./gradlew assembleRelease -Pfoss --parallel --build-cache "$SIGNING_FLAGS"
          if [ -f app/build/outputs/apk/release/app-universal-release.apk ]; then
            cp app/build/outputs/apk/release/app-universal-release.apk release_artifacts/app-foss-release.apk
          elif [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release_artifacts/app-foss-release.apk
          else
            echo "ERROR: FOSS APK not found - neither app-universal-release.apk nor app-release.apk exists"
            exit 1
          fi

          # 4. Generate SHA-256 Checksums for all release artifacts
          cd release_artifacts
          sha256sum * > checksums.txt
          cd ..

      - name: Extract version name
        id: version
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | head -1 | awk '{print $3}' | tr -d '"')
          echo "version_name=${VERSION_NAME:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Organize artifacts & generate summary
        run: |
          echo "=== Artifacts to Publish ==="
          ls -lh release_artifacts/

          echo "### 📦 QuickDash v${{ steps.version.outputs.version_name }} Release Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "| File Name | Size | SHA-256 Checksum |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          for file in release_artifacts/*; do
            if [ -f "$file" ]; then
              fname=$(basename "$file")
              fsize=$(ls -lh "$file" | awk '{print $5}')
              fsha=$(sha256sum "$file" | awk '{print $1}')
              echo "| \`$fname\` | $fsize | \`$fsha\` |" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Update update.json with checksum
        run: |
          APK_FILE="release_artifacts/app-universal-release.apk"
          if [ -f "$APK_FILE" ]; then
            SHA256=$(sha256sum "$APK_FILE" | cut -d' ' -f1)
            SIZE=$(stat -c%s "$APK_FILE")
            jq --arg sha "$SHA256" --argjson size "$SIZE" \
              '.apk_sha256 = $sha | .apk_size_bytes = $size' \
              website/public/api/v1/update.json > website/public/api/v1/update.json.tmp
            mv website/public/api/v1/update.json.tmp website/public/api/v1/update.json
          fi

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}-${{ github.run_number }}
          name: QuickDash v${{ steps.version.outputs.version_name }}
          body: |
            ## QuickDash v${{ steps.version.outputs.version_name }}

            ### 📦 Downloads
            - **`app-foss-release.apk`** — 🌿 **100% Zero-Tracker FOSS Edition** (for F-Droid & IzzyOnDroid)
            - **`app-universal-release.apk`** — Universal APK (works on all Android devices)
            - **`app-arm64-v8a-release.apk`** — 64-bit ARM for modern devices (2020+)
            - **`app-armeabi-v7a-release.apk`** — 32-bit ARM for older devices
            - **`app-release.aab`** — Google Play App Bundle
            - **`checksums.txt`** — Cryptographic SHA-256 file hashes

            ### 📲 Install Instructions
            1. Download the APK for your device.
            2. On Android, enable **Settings → Install unknown apps** for your browser.
            3. Open the file and tap **Install**.
          draft: false
          prerelease: false
          files: release_artifacts/*

      - name: Commit updated update.json
        run: |
          NEW_TAG="v${{ steps.version.outputs.version_name }}-${{ github.run_number }}"
          RELEASES_URL="https://github.com/${{ github.repository }}/releases/latest"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md website/public/api/v1/update.json
          git commit -m "chore: bump release tag and checksum to ${NEW_TAG}" || echo "Nothing to commit"
          git pull --rebase origin master || true
          git push