name: Android Release Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Decode keystore
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          else
            echo "No keystore provided"
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Decode google-services.json
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          else
            echo "No google-services.json provided"
          fi
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      - name: Create local.properties for Secrets
        run: |
          echo "TG_BOT_TOKEN=${{ secrets.TG_BOT_TOKEN }}" >> local.properties
          echo "TG_BROADCAST_BOT_TOKEN=${{ secrets.TG_BROADCAST_BOT_TOKEN }}" >> local.properties
          echo "TG_CHAT_ID=${{ secrets.TG_CHAT_ID }}" >> local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Build APKs and Play Bundle (.aab)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "keystore.jks" ]; then
            echo "Building signed APK splits..."
            ./gradlew clean assembleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/keystore.jks \
              -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
              -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
              -Pandroid.injected.signing.key.password=$KEY_PASSWORD
            
            echo "Building signed Play Bundle (.aab)..."
            ./gradlew bundleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/keystore.jks \
              -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
              -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
              -Pandroid.injected.signing.key.password=$KEY_PASSWORD
          else
            echo "No keystore provided, building unsigned APK splits and Bundle..."
            ./gradlew clean assembleRelease
            ./gradlew bundleRelease
          fi

      - name: Get App Version
        id: version
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | head -n 1 | awk '{print $3}' | tr -d '"')
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Organize Release Artifacts
        run: |
          mkdir -p release_artifacts
          
          # Copy all generated split APKs
          cp app/build/outputs/apk/release/*.apk release_artifacts/ 2>/dev/null || true

          # Copy Play Bundle (.aab)
          if [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            cp app/build/outputs/bundle/release/app-release.aab release_artifacts/app-release.aab
          fi

          echo "Final release artifacts collected:"
          ls -lh release_artifacts/

      - name: Create GitHub Release
        id: create_release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}-${{ github.run_number }}
          name: QuickDash v${{ env.VERSION_NAME }}
          body: |
            ## QuickDash v${{ env.VERSION_NAME }} Official Release

            ### Available Download Formats
            - **`app-universal-release.apk`**: Recommended universal build. Works on 100% of Android devices (Android 7.0–15).
            - **`app-arm64-v8a-release.apk`**: Optimized 64-bit ARM build (~25 MB) for modern devices (Pixel 6/7/8/9, Galaxy S20+, OnePlus 8+).
            - **`app-armeabi-v7a-release.apk`**: 32-bit ARM build (~20 MB) for legacy hardware.
            - **`app-release.aab`**: Official Google Play App Bundle format for Play Console publishing.

            ### Installation Guide
            1. Download your preferred APK format above.
            2. On your Android phone, enable **Settings → Install unknown apps** for your browser or file manager.
            3. Open the downloaded file and tap **Install**.

            > 🛡️ **Play Protect Note:** If Google Play Protect shows a prompt, tap **"More details"** → **"Install anyway"**. QuickDash is 100% telemetry-free and open source.
          draft: false
          prerelease: false
          files: release_artifacts/*

      - name: Update README Download Link and Tag Name
        if: github.ref == 'refs/heads/main'
        run: |
          NEW_TAG="v${{ env.VERSION_NAME }}-${{ github.run_number }}"
          NEW_URL="https://github.com/${{ github.repository }}/releases/download/${NEW_TAG}/app-universal-release.apk"
          echo "Updating README to download link: $NEW_URL and tag: $NEW_TAG"
          
          # Replace the release APK link in README
          sed -i -E "s|https://github.com/[^/]+/[^/]+/releases/download/[^/]+/[a-zA-Z0-9._-]+\.apk|$NEW_URL|g" README.md
          
          # Replace the Latest Tag text in README
          sed -i -E "s|\*\*Latest Tag: \`v[0-9.-]+\`\*\*|\*\*Latest Tag: \`${NEW_TAG}\`\*\*|g" README.md
          
          # Configure Git and commit the change
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update README download link and tag to ${NEW_TAG} [skip ci]" || echo "No changes to commit"
          git push
